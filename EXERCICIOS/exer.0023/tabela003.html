<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        th {
            border: 1px solid black;
            padding: 10px;
            width: 100px;
            text-align: center;
          
        }
        table {
            border-collapse: collapse;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>Mesclagem de tabelas</h1>
    <table>
        <tr>
            <th>A</th>
            <th colspan="2">B</th>
           

        </tr>
        <tr>
            <th rowspan="3">D</th>
            <th>E</th>
            <th rowspan="2">F</th>

        </tr>
        <tr>
            
            <th>H</th>
           

        </tr>
        <tr>
            
            <th>K</th>
            <th>L</th>

        </tr>
    </table>
    
</body>
</html>
