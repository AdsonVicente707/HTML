<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas diferenciadas</title>
    <style>
        * {
            font-weight: bold;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        th,td {
            border: 1px solid black;
            padding: 10px;
            width: 100px;
            text-align: center;
        }
        table {
            border-collapse: collapse;
            margin: 20px 0;
        }
        thead {
            background-color: #0f66e9;
            color: white;
        }
        .medias {
            background-color: #0f66e9;
            color: white;
            text-align: left;
        }
        .res {
            background-color: #0f66e9;
            color: white;
           
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th  rowspan="2">Area</th>
                <th rowspan="2">Disciplina</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
               
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
                
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matematica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                
                <td>Fisica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
               
                <td>Quimica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <th colspan="4" class="medias"> Media de exatas</th>
            <td class="res">0.0</td>
            <tr>
                <th rowspan="2">Humanas</th>
                <td>Portugues</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Historia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>    
            </tr>
            <th colspan="4"class="medias"> Media de humanas</th>
            <td class="res">0.0</td>    
           
        </tbody>
    </table>
    
</body>
</html>
